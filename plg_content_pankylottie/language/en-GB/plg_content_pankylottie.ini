PLG_CONTENT_PANKYLOTTIE_USAGE_DESC="<p>Write <code>{lottie src=&quot;images/animation.lottie&quot; alt=&quot;Description&quot;}</code> in an article, or use the <strong>Lottie</strong> editor button.</p><p>Optional attributes override the defaults above: <code>trigger</code> (autoplay, viewport, hover, click, scroll), <code>hover-out</code> (stop, pause, reverse), <code>loop</code>, <code>controls</code>, <code>reduced-motion</code>, <code>decorative</code> (1 or 0), <code>speed</code>, <code>mode</code> (forward, reverse, bounce, reverse-bounce), <code>width</code>, <code>height</code>, <code>ratio</code>, <code>fit</code>, <code>background</code> (#RRGGBB), <code>segment</code> (e.g. 10-60), <code>marker</code>, <code>theme</code>, <code>link</code>, <code>target</code> (_blank).</p>"
