PLG_CONTENT_PANKYLOTTIE_USAGE_DESC="<p>Γράψτε <code>{lottie src=&quot;images/animation.lottie&quot; alt=&quot;Περιγραφή&quot;}</code> σε ένα άρθρο ή χρησιμοποιήστε το κουμπί <strong>Lottie</strong> του επεξεργαστή.</p><p>Προαιρετικά χαρακτηριστικά που υπερισχύουν των παραπάνω προεπιλογών: <code>trigger</code> (autoplay, viewport, hover, click, scroll), <code>hover-out</code> (stop, pause, reverse), <code>loop</code>, <code>controls</code>, <code>reduced-motion</code>, <code>decorative</code> (1 ή 0), <code>speed</code>, <code>mode</code> (forward, reverse, bounce, reverse-bounce), <code>width</code>, <code>height</code>, <code>ratio</code>, <code>fit</code>, <code>background</code> (#RRGGBB), <code>segment</code> (π.χ. 10-60), <code>marker</code>, <code>theme</code>, <code>link</code>, <code>target</code> (_blank).</p>"
