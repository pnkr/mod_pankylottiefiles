PKG_PANKYLOTTIE="Panky Lottie Files"
PKG_PANKYLOTTIE_MEDIA_NOTICE="Για να επιλέγετε αρχεία .lottie και .json από τη Διαχείριση πολυμέσων, ανοίξτε <em>Σύστημα → Πολυμέσα → Επιλογές</em> και προσθέστε <code>json,lottie</code> στις <em>Επιτρεπόμενες επεκτάσεις</em> και στις <em>Επιτρεπόμενες επεκτάσεις εγγράφων</em>, και <code>application/json,application/zip</code> στους <em>Επιτρεπόμενους τύπους MIME</em>. Τα URL λειτουργούν και χωρίς αυτό."
PKG_PANKYLOTTIE_XML_DESCRIPTION="Lottie και dotLottie animations για το Joomla 6: ένθεμα, πρόσθετο περιεχομένου για ετικέτες {lottie} και κουμπί επεξεργαστή."
