PKG_PANKYLOTTIE="Panky Lottie Files"
PKG_PANKYLOTTIE_MEDIA_NOTICE="To pick .lottie and .json files from the Media Manager, open <em>System → Media → Options</em> and add <code>json,lottie</code> to <em>Legal Extensions</em> and <em>Legal Document Extensions</em>, and <code>application/json,application/zip</code> to <em>Legal MIME Types</em>. URLs work without this."
PKG_PANKYLOTTIE_XML_DESCRIPTION="Lottie and dotLottie animations for Joomla 6: a site module, a content plugin for {lottie} tags and an editor button."
